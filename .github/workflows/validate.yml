name: validate

on:
  push:
  pull_request:
  # Callable, so `release.yml` gates a publish on THIS suite instead of a
  # copy of it. The negative self-tests live here as steps; running them
  # from the release workflow any other way means a second home per plant.
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate repo consistency
        run: python3 test/validate.py
      - name: Brand linter unit tests (fixture per check code)
        run: python3 test/brand_lint_test.py
      - name: UX linter fixtures
        run: python3 test/ux_lint_test.py

      # This project's own chain and brand pack, run by the linters it ships.
      # Absent until 0.39.0, which is why docs/brand/ sat red on B030 with a
      # facts.md three counts stale and nothing said so. The hard rule this
      # repo installs into other projects has always required exactly this
      # ("wire it into CI or pre-commit alongside the UX linter so copy drift
      # cannot merge"); the repo was the one project not obeying it.
      - name: Dogfood the UX chain
        run: python3 docs/ux/lint.py
      - name: Dogfood the brand pack
        run: python3 docs/brand/lint.py

      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          # The repo's own validator enforces house rules; this one is the
          # upstream spec. --strict fails on unrecognized manifest fields and on
          # front matter that silently drops at runtime -- both were real here.
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/super-ux --strict
